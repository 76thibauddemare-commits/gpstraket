<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>GPS Traket</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GPS Traket" />

  <!-- Leaflet (carte interactive) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- ======================= VUE ENREGISTREMENT ======================= -->
    <section id="view-record" class="view active">
      <header class="topbar">
        <h1>GPS Traket</h1>
        <button id="btn-goto-list" class="icon-btn" aria-label="Mes enregistrements">☰</button>
      </header>

      <div class="record-body">
        <div id="gps-status" class="gps-status searching">
          <span class="dot"></span>
          <span id="gps-status-text">Recherche du signal GPS…</span>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat-value" id="stat-time">00:00:00</div>
            <div class="stat-label">Durée</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="stat-distance">0.00</div>
            <div class="stat-label">km</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="stat-points">0</div>
            <div class="stat-label">points</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="stat-events">0</div>
            <div class="stat-label">événements</div>
          </div>
        </div>

        <div class="accuracy-row">
          <span id="accuracy-text">Précision : —</span>
        </div>

        <div class="controls">
          <button id="btn-record" class="record-btn">
            <span class="record-icon"></span>
            <span class="record-label">Démarrer</span>
          </button>
        </div>

        <button id="btn-flag" class="flag-btn" disabled>
          🚩 SIGNALER UN ÉVÉNEMENT
        </button>
        <p class="hint" id="flag-hint">Démarre un enregistrement pour pouvoir signaler des événements.</p>
      </div>

      <div id="toast" class="toast" hidden></div>
    </section>

    <!-- ======================= VUE LISTE ======================= -->
    <section id="view-list" class="view">
      <header class="topbar">
        <button id="btn-back-record" class="icon-btn" aria-label="Retour">←</button>
        <h1>Mes enregistrements</h1>
        <span style="width:2.5rem"></span>
      </header>
      <div id="list-body" class="list-body">
        <p class="empty" id="list-empty">Aucun enregistrement pour l'instant.</p>
        <ul id="recordings-list"></ul>
      </div>
    </section>

    <!-- ======================= VUE CARTE ======================= -->
    <section id="view-map" class="view">
      <header class="topbar">
        <button id="btn-back-list" class="icon-btn" aria-label="Retour">←</button>
        <h1 id="map-title">Tracé</h1>
        <button id="btn-map-menu" class="icon-btn" aria-label="Options">⋮</button>
      </header>
      <div id="map"></div>
      <div id="map-info" class="map-info"></div>
      <div id="map-events" class="map-events" hidden></div>
      <div id="map-actions" class="map-actions" hidden>
        <button id="btn-export-gpx" class="action-btn primary">⬇ Exporter le GPX</button>
        <button id="btn-delete-rec" class="action-btn danger">🗑 Supprimer</button>
      </div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
